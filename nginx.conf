server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Enable HTML5 History API route resolution for single-page apps (SPA)
        try_files $uri $uri/ /index.html;
    }

    # Enable offline caching and client-side storage optimizations
    location ~* \.(?:css|js|woff2?|svg|gif|png|jpe?g|webp|ico|json)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Custom offline diagnostics pages or healthchecks if needed
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
